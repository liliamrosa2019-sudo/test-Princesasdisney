<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué Princesa Disney eres realmente?</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ffb7c5; --purple: #e6e6fa; --gold: #d4af37; --dark: #4a3b52; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #ffd1dc, #e6e6fa); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; color: var(--dark); }
        .box { width: 100%; max-width: 600px; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; border: 2px solid var(--gold); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { font-family: 'Playfair Display', serif; color: #7b4b94; text-align: center; font-size: 1.6rem; margin-bottom: 5px; }
        .sub { text-align: center; font-size: 0.85rem; color: #6b5b75; margin-bottom: 20px; }
        .bar-bg { height: 8px; background: #eee; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .bar-fill { height: 100%; width: 10%; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: 0.3s; }
        .q-card { display: none; }
        .q-card.active { display: block; }
        .q-title { font-weight: 600; margin-bottom: 15px; color: #4a2c5a; }
        .opt { display: flex; align-items: center; background: #fff; padding: 12px 15px; border-radius: 12px; border: 1.5px solid #e2d2eb; margin-bottom: 10px; cursor: pointer; }
        .opt input { margin-right: 12px; accent-color: var(--gold); }
        .btns { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 25px; border: none; font-weight: 600; cursor: pointer; }
        .btn-prev { background: #eee; color: #555; }
        .btn-next { background: var(--gold); color: #fff; margin-left: auto; }
        .btn:disabled { opacity: 0.5; }
        #res { display: none; text-align: center; }
        .res-title { font-family: 'Playfair Display', serif; color: #6a2c70; font-size: 1.8rem; margin: 10px 0; }
        .res-sec { text-align: left; background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee; font-size: 0.9rem; }
        .res-sec h3 { color: #7b4b94; font-size: 0.95rem; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <header>
            <h1>👑 ¿Qué Princesa Disney eres?</h1>
            <p class="sub">Descubre tu personalidad y tus fortalezas mágicas</p>
        </header>
        <div id="quiz">
            <div class="bar-bg"><div class="bar-fill" id="fill"></div></div>
            <div id="q-wrap"></div>
            <div class="btns">
                <button class="btn btn-prev" id="b-prev" disabled onclick="nav(-1)">Anterior</button>
                <button class="btn btn-next" id="b-next" disabled onclick="nav(1)">Siguiente</button>
            </div>
        </div>
        <div id="res">
            <h2 class="res-title" id="r-name"></h2>
            <div class="res-sec"><h3>✨ Tu Esencia</h3><p id="r-ess"></p></div>
            <div class="res-sec"><h3>💎 Tus Fortalezas</h3><p id="r-str"></p></div>
            <div class="res-sec"><h3>🌸 Para Cuidar</h3><p id="r-weak"></p></div>
            <div class="res-sec"><h3>👑 Tu Segunda Princesa</h3><p id="r-sec"></p></div>
            <div style="background:#fff5f8; padding:12px; border-left:4px solid var(--gold); margin-top:15px; font-style:italic;" id="r-msg"></div>
            <button class="btn btn-next" style="margin-top:15px;" onclick="location.reload()">🔄 Repetir</button>
        </div>
    </div>
    <script>
        const P = {
            "Rapunzel": { ess: "Creativa, alegre y llena de imaginación. Expresas tu luz a través del arte.", str: "Gran talento artístico, entusiasmo, optimismo y alegría.", weak: "Dudar de tus capacidades al sentirte insegura.", sec: "Bella", msg: "Muestra tus verdaderos colores al mundo sin miedo." },
            "Bella": { ess: "Inteligente, independiente y auténtica. Valoras la verdad por encima de todo.", str: "Mente brillante, amor por aprender y pensamiento propio.", weak: "Aislarte cuando sientes que no te entienden.", sec: "Rapunzel", msg: "Ser diferente es tu mayor superpoder." },
            "Mulán": { ess: "Valiente, ingeniosa y leal. Superas cualquier obstáculo con honor.", str: "Valentía enorme, lealtad y fuerza para proteger a los tuyos.", weak: "Exigirte ser perfecta todo el tiempo.", sec: "Moana", msg: "Eres más fuerte de lo que te imaginas." },
            "Cenicienta": { ess: "Resiliente y amable. Tu fe y tu corazón noble superan todo.", str: "Paciencia, esperanza inquebrantable y gran elegancia.", weak: "Aguantar situaciones injustas por mucho tiempo.", sec: "Blancanieves", msg: "Tus sueños sí se hacen realidad." },
            "Moana": { ess: "Líder natural, intrépida y persistente. Sigues tu propia voz.", str: "Determindada, aventurera y perseverante.", weak: "Cargar con todo tú sola.", sec: "Mulán", msg: "Estás lista para navegar cualquier mar." }
        };
        const Q = [
            { q: "1. Ante un problema, ¿qué haces?", o: [["A", "Lo resuelvo por mí misma", "Mulán"], ["B", "Pienso una solución inteligente", "Bella"], ["C", "Pido apoyo a alguien de confianza", "Cenicienta"], ["D", "Lo me enfrento sin miedo", "Moana"]] },
            { q: "2. ¿Qué es lo más importante para ti?", o: [["A", "Mi libertad", "Bella"], ["B", "Las personas que amo", "Cenicienta"], ["C", "Mis sueños y arte", "Rapunzel"], ["D", "Demostrar lo que valgo", "Mulán"]] },
            { q: "3. ¿Cómo eres en tu tiempo libre?", o: [["A", "Pinto, creo o hago cosas con las manos", "Rapunzel"], ["B", "Leo o aprendo algo nuevo", "Bella"], ["C", "Entreno o busco aventuras", "Moana"], ["D", "Paso tiempo tranquila", "Cenicienta"]] },
            { q: "4. ¿Cómo te describirían tus amigas?", o: [["A", "Cariñosa y dulce", "Cenicienta"], ["B", "Inteligente y sabia", "Bella"], ["C", "Valiente y leal", "Mulán"], ["D", "Alegre y super creativa", "Rapunzel"]] },
            { q: "5. ¿Cuál es tu mayor lema?", o: [["A", "Mi imaginación es mi fuerza", "Rapunzel"], ["B", "Soy fiel a mí misma", "Bella"], ["C", "Protegeré a los que amo", "Mulán"], ["D", "La amabilidad vence todo", "Cenicienta"]] }
        ];
        let c = 0, ans = {};
        function init() {
            let w = document.getElementById('q-wrap');
            Q.forEach((q, i) => {
                let d = document.createElement('div');
                d.className = `q-card ${i===0?'active':''}`; d.id = `q-${i}`;
                let opts = q.o.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" onchange="sel(${i},'${o[2]}')"> <span><b>${o[0]}.</b> ${o[1]}</span></label>`).join('');
                d.innerHTML = `<div class="q-title">${q.q}</div>${opts}`;
                w.appendChild(d);
            });
        }
        function sel(i, p) { ans[i] = p; document.getElementById('b-next').disabled = false; }
        function nav(dir) {
            document.getElementById(`q-${c}`).classList.remove('active');
            c += dir;
            if(c >= Q.length) return calc();
            document.getElementById(`q-${c}`).classList.add('active');
            document.getElementById('fill').style.width = `${((c+1)/Q.length)*100}%`;
            document.getElementById('b-prev').disabled = c === 0;
            document.getElementById('b-next').disabled = !ans[c];
            document.getElementById('b-next').innerText = c === Q.length-1 ? "Ver Resultado ✨" : "Siguiente";
        }
        function calc() {
            let sc = {}; Object.values(ans).forEach(p => sc[p] = (sc[p]||0)+1);
            let win = Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0] || "Rapunzel";
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('res').style.display = 'block';
            let p = P[win];
            document.getElementById('r-name').innerText = `¡Eres como ${win}! 👑`;
            document.getElementById('r-ess').innerText = p.ess;
            document.getElementById('r-str').innerText = p.str;
            document.getElementById('r-weak').innerText = p.weak;
            document.getElementById('r-sec').innerText = `También tienes rasgos de ${p.sec}.`;
            document.getElementById('r-msg').innerText = `"${p.msg}"`;
        }
        window.onload = init;
    </script>
</body>
</html>
